<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar acceso — Calatrava</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/icono-calatrava.png">
  <link rel="apple-touch-icon" href="assets/icono-app.png">
</head>
<body class="auth">
  <div class="registro">
    <aside class="auth-brand imagen">
      <div class="auth-brand-copy auth-copy">
        <div class="auth-mark"><img src="assets/logo-calatrava.png" alt="Calatrava Parqueadero"></div>
        <h2>Restablecer acceso</h2>
        <p>Enviaremos un enlace de recuperación al correo asociado a su cuenta.</p>
      </div>
    </aside>
    <div class="campos">
      <div class="campos_sec">
        <h1 class="titu">Recuperar contraseña</h1>
        <p class="auth-lead">Indique el correo registrado en el sistema.</p>
        <form id="recuperar">
          <div class="formulario">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com">
          </div>
          <button type="submit" class="reserr">Enviar enlace</button>
        </form>
        <div class="auth-links">
          <p><a href="login.html">Volver al inicio de sesión</a></p>
        </div>
      </div>
    </div>
  </div>
  <form id="LoginForm" class="form-hidden" aria-hidden="true">
    <label for="login-correo">Correo</label>
    <input type="email" id="login-correo" name="correo">
    <label for="login-contrasena">Contraseña</label>
    <input type="password" id="login-contrasena" name="contraseña">
  </form>
  <script type="module" src="./backend/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <div id="pantallaCarga" class="pantalla_carga" aria-hidden="true" role="status">
    <div class="pantalla_carga_caja">
      <div class="pantalla_carga_anillo" aria-hidden="true"><img class="pantalla_carga_icono" src="assets/icono-calatrava.png" alt=""></div>
      <p class="pantalla_carga_texto">Procesando…</p>
      <p class="pantalla_carga_sub">Calatrava Parqueadero</p>
    </div>
  </div>
  <script src="loader.js"></script>
</body>
</html>
